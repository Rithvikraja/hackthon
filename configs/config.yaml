project:
  seed: 42
  profile: hackathon            # demo | hackathon | full
  output_dir: results
 
data:
  raw_dir: data/raw
  external_dir: data/external
  processed_dir: data/processed
  donors: [9861, 10021, 12876, 14380, 15496, 15697]
  pa_min_fraction: 0.5
  gwas_p_threshold: 5.0e-8
  min_disease_genes: 15
  diseases:
    PD: {name: "Parkinson's disease", efo: EFO_0002508}
    AD: {name: "Alzheimer's disease", efo: EFO_0000249}
    HD: {name: "Huntington's disease", efo: EFO_0000544}
 
stats:
  n_permutations: 10000
  n_expr_bins: 20
  fdr_method: fdr_bh
  tau_label: 1.645
  label_mode: threshold         # threshold | quantile
 
ml:
  pool_size: 500
  outer_folds: 6
  region_heldout: true
 
xgb_space:
  learning_rate: [0.01, 0.30, log]
  n_estimators: [50, 400, int]
  max_depth: [2, 6, int]
  subsample: [0.5, 1.0, linear]
  colsample_bytree: [0.4, 1.0, linear]
  min_child_weight: [1, 10, int]
  reg_alpha: [0.001, 10, log]
  reg_lambda: [0.1, 20, log]
  gamma: [0, 5, linear]
  aug_sigma: [0.0, 0.30, linear]
 
nsga2:
  pop_size: 60
  generations: 40
  crossover_prob: 0.9
  k_min: 5
  k_max: 60
  n_jobs: 4
 
robustness:
  noise_levels: [0.05, 0.10, 0.20]
  dropout_levels: [0.05, 0.10, 0.20]
  shift_levels: [[1.0, 0.10], [1.15, 0.25], [1.3, 0.50]]
  n_repeats: 20
 
shap:
  max_rows: 1500
 
profiles:
  hackathon:
    stats: {n_permutations: 2000}
    ml: {pool_size: 300, outer_folds: 3}
    nsga2: {pop_size: 32, generations: 20, n_jobs: 4}
    robustness: {n_repeats: 10}
    shap: {max_rows: 500}
  demo:
    stats: {n_permutations: 500}
    ml: {pool_size: 200, outer_folds: 1}
    nsga2: {pop_size: 16, generations: 8, n_jobs: 2}
    robustness: {n_repeats: 5, noise_levels: [0.10], dropout_levels: [0.10], shift_levels: [[1.15, 0.25]]}
    shap: {max_rows: 200}
